name: CI

on:
  push:
    branches:
      - ShimmerPatch
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  pull_request:
    branches:
      - ShimmerPatch
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Redirect the nested ManifestEditor submodule to the fork
        run: >-
          git config --global url."https://github.com/Ujhhgtg/ManifestEditor.git".insteadOf
          "https://github.com/HSSkyBoy/ManifestEditor.git"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # Keep a single owner for the Gradle dependency and wrapper caches.
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up ninja
        uses: seanmiddleditch/gha-setup-ninja@master
        with:
          version: 1.12.1

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.1'

      - name: Remove the Android-bundled CMake
        run: rm -rf "$ANDROID_HOME/cmake"

      # A runner that has never built an Android app has no debug keystore, and AGP only creates it
      # lazily, while validating the signing config - after the configuration cache has been written.
      # The manager reads the signing fingerprint at that earlier point, so create the well-known
      # debug key up front: the APKs then pin the very key they are signed with, instead of falling
      # back to no pinning at all. AGP looks for it under ANDROID_USER_HOME when that is set.
      - name: Create the Android debug keystore
        run: |
          KEYSTORE_DIR="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair \
            -keystore "$KEYSTORE_DIR/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant execute permission
        run: chmod +x gradlew

      # No signing secrets are provided, so the Gradle signing config falls
      # back to the Android debug keystore and Release artifacts stay installable.
      - name: Build
        run: ./gradlew buildAll

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shimmerpatch-release-${{ github.sha }}
          path: out/release/*
          retention-days: 14

      - name: Upload Debug artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shimmerpatch-debug-${{ github.sha }}
          path: out/debug/*
          retention-days: 7

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: mappings-${{ github.sha }}
          path: |
            patch-loader/build/outputs/mapping
            manager/build/outputs/mapping

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.sha }}
          path: patch-loader/build/symbols
